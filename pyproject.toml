[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheet-music-recognition"
version = "0.2.0"
description = "Experimental offline optical music recognition (OMR): sheet-music images and PDFs to MusicXML, MIDI, JSON and MP3, with Python and Java"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Luckolite"}]
keywords = ["optical music recognition", "omr", "sheet music", "music ocr", "pdf to musicxml", "sheet music to midi", "musicxml", "midi", "guitar tablature", "offline"]
dependencies = ["numpy>=1.23.5,<2", "Pillow>=10,<13", "tensorflow==2.15.1", "rapidocr==3.9.2", "onnxruntime==1.23.2"]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Multimedia :: Sound/Audio :: MIDI", "Programming Language :: Python :: 3", "Programming Language :: Java"]

[project.optional-dependencies]
# Retain the former extra so existing installation commands remain valid.
inference = []
pdf = ["pypdfium2>=4.30,<5"]
audio = ["imageio-ffmpeg>=0.5,<0.7"]

[project.scripts]
sheet-music-recognition = "sheet_music_recognition.cli:main"

[project.urls]
Documentation = "https://github.com/Luckolite/Sheet-Music-Recognition/blob/main/docs/README.md"
Repository = "https://github.com/Luckolite/Sheet-Music-Recognition"
Issues = "https://github.com/Luckolite/Sheet-Music-Recognition/issues"
Downloads = "https://github.com/Luckolite/Sheet-Music-Recognition/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sheet_music_recognition = ["interpreter.jar", "data/*.tflite", "data/LICENSE", "data/NOTICE"]
