[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-sheets-interpreter"
version = "0.1.4"
description = "Experimental offline sheet-music recognition with permissively licensed weights and a standalone Java decoder"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "Apache-2.0"}
authors = [{name = "Luckolite"}]
dependencies = ["numpy>=1.23.5,<2", "Pillow>=10,<13"]
classifiers = ["Development Status :: 3 - Alpha", "Topic :: Multimedia :: Sound/Audio :: MIDI", "Programming Language :: Python :: 3", "Programming Language :: Java"]

[project.optional-dependencies]
inference = ["tensorflow==2.15.1", "rapidocr==3.9.2", "onnxruntime==1.23.2"]
pdf = ["pypdfium2>=4.30,<5"]
audio = ["imageio-ffmpeg>=0.5,<0.7"]

[project.scripts]
sheet-interpreter = "sheet_interpreter.cli:main"

[project.urls]
Repository = "https://github.com/Luckolite/Music-Sheets-Interpreter"
Issues = "https://github.com/Luckolite/Music-Sheets-Interpreter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sheet_interpreter = ["interpreter.jar", "data/*.tflite", "data/LICENSE", "data/NOTICE"]
