name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: '0.1.6.post1'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify publication identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              project = tomllib.load(stream)['project']
          assert project['name'] == 'score-reader'
          expected = os.environ['REQUESTED_VERSION'] or os.environ['RELEASE_TAG'].removeprefix('v')
          assert project['version'] == expected, 'Release and package versions differ'
          PY
      - run: python scripts/build_java.py
      - run: python scripts/verify_package.py
      - run: python -m pip install . twine
      - run: python -m pip wheel . --no-deps -w dist
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          score-reader --help
          sheet-interpreter --help
          score-reader examples/scale.png --output base-install-smoke.json --midi base-install-smoke.mid --musicxml base-install-smoke.musicxml
          python -m pip install ".[pdf,audio]"
          python scripts/smoke_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-distributions
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/score-reader/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
