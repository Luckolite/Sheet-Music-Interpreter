name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python scripts/build_java.py
      - run: python -m pip install ".[inference,pdf,audio]"
      - run: python scripts/verify_package.py
      - run: python scripts/test_java.py --jobs 4
      - run: python -m pip install opencv-python-headless==4.10.0.84
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s training -p test_book_geometry.py -v
      - run: python scripts/smoke_test.py
      - run: python -m pip wheel . --no-deps -w dist
